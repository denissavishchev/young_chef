name: young_chef
description: "Young Chef"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.9

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider:
  flutter_screenutil: ^5.9.3
  easy_localization: ^3.0.8
  country_flags: ^4.0.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  flutter_svg: ^2.2.1
  dio: ^5.9.2
  flutter_dotenv: ^6.0.0
  flutter_spinkit: ^5.2.2
  google_generative_ai: ^0.4.7
  speech_to_text: ^7.4.0
  lottie: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/
    - assets/animations/
    - keys.env
